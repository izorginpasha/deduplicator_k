

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_KRAFT_MODE=true
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LOG_DIRS=/tmp/kraft-combined-logs
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - redis

  ydb:
    image: cr.yandex/yc/yandex-docker-local-ydb:latest
    container_name: ydb-local
    ports:
      - "2135:2135"  # gRPC с TLS
      - "2136:2136"  # gRPC без TLS
      - "8765:8765"  # мониторинг
    environment:
      - YDB_DEFAULT_LOG_LEVEL=NOTICE
      - GRPC_TLS_PORT=2135
      - GRPC_PORT=2136
      - MON_PORT=8765
    volumes:
      - ./ydb_certs:/ydb_certs
      - ./ydb_data:/ydb_data
    restart: always
    depends_on:
      - kafka

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TOPIC=events
      - KAFKA_BOOTSTRAP=kafka:9092
      - YDB_ENDPOINT=ydb:2135  # указываем адрес YDB
    depends_on:
      - kafka
      - redis
      - ydb
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  ydb_data:  # том для данных YDB
  ydb_certs:  # том для сертификатов
